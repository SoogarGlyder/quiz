                    { label: 'A', teks: 'Diciptakan oleh para bangsawan dan diiringi gamelan lengkap.' },
                    { label: 'B', teks: 'Memiliki gerak yang sangat rumit, elegan, dan kostum yang gemerlap.' },
                    { label: 'C', teks: 'Gerakan bersumber dari peniruan alam (imitatif hewan/tumbuhan) dengan ritme hentakan kaki sederhana yang bernuansa magis.' },
                    { label: 'D', teks: 'Diselenggarakan di gedung-gedung pertunjukan berteknologi modern.' }
                ],
                kunci: 'C',
                pembahasan: 'Manusia prasejarah belum mengenal peradaban modern/kerajaan. Tarian mereka lahir dari insting meniru gerakan alam (hewan, angin, burung) guna keperluan magis/bertahan hidup[cite: 2].'
            }
        ];

        let currentSoalIndex = 0;
        let score = 0;

        const soalTracker = document.getElementById('soal-tracker');
        const scoreTracker = document.getElementById('score-tracker');
        const pertanyaanEl = document.getElementById('pertanyaan');
        const opsiContainer = document.getElementById('opsi-container');
        const pembahasanBox = document.getElementById('pembahasan-box');
        const pembahasanTeks = document.getElementById('pembahasan-teks');
        const btnNext = document.getElementById('btn-next');

        function loadSoal() {
            pembahasanBox.style.display = 'none';
            btnNext.style.display = 'none';
            opsiContainer.innerHTML = '';
            
            const soalDataSekarang = soalData[currentSoalIndex];
            soalTracker.innerText = `Soal ${currentSoalIndex + 1} / ${soalData.length}`;
            pertanyaanEl.innerHTML = soalDataSekarang.pertanyaan;

            soalDataSekarang.opsi.forEach(opsi => {
                const btn = document.createElement('button');
                btn.classList.add('btn-opsi');
                btn.innerHTML = `<span style="margin-right: 15px; background: #fff; border: 2px solid #000; padding: 2px 8px; border-radius: 4px;">${opsi.label}</span> ${opsi.teks}`;
                btn.onclick = () => cekJawaban(btn, opsi.label, soalDataSekarang.kunci, soalDataSekarang.pembahasan);
                opsiContainer.appendChild(btn);
            });
        }

        function cekJawaban(btnElement, jawabanDipilih, jawabanBenar, pembahasan) {
            const semuaBtn = document.querySelectorAll('.btn-opsi');
            
            // Matikan semua tombol setelah dijawab
            semuaBtn.forEach(btn => {
                btn.disabled = true;
                const labelOpsinya = btn.innerText.charAt(0);
                if (labelOpsinya === jawabanBenar) {
                    btn.classList.add('benar');
                }
            });

            if (jawabanDipilih === jawabanBenar) {
                score += 2; // Setiap soal benar bernilai 2 poin (2 x 50 soal = 100)
                scoreTracker.innerText = `Skor: ${score}`;
            } else {
                btnElement.classList.add('salah');
            }x

            // Tampilkan pembahasan dan tombol next
            pembahasanTeks.innerText = pembahasan;
            pembahasanBox.style.display = 'block';
            btnNext.style.display = 'block';
        }

        function nextSoal() {
            currentSoalIndex++;
            if (currentSoalIndex < soalData.length) {
                loadSoal();
            } else {
                document.getElementById('quiz-content').style.display = 'none';
                document.querySelector('.header').style.display = 'none';
                document.getElementById('score-board').style.display = 'block';
                document.getElementById('final-score').innerText = `Skor Akhir: ${score}`;
            }
        }

        // Jalankan kuis saat pertama kali dirender
        loadSoal();
    </script>
</body>
</html>
